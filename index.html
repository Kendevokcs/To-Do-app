<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css" />

  <!-- firebase sdk-k -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
</head>
<body>

  <!-- felso navigacios resz / auth -->
  <header class="top-nav">
    <div class="logo">MaybeTomorrow</div>
    <div class="auth-bar">
      <!-- kijelentkezett nézet -->
      <div id="logged-out-view">
        <button id="btn-open-login" class="btn btn-outline">Log In</button>
        <button id="btn-open-signup" class="btn btn-primary">Sign Up</button>
      </div>

      <!-- bejelentkezett nézet -->
      <div id="logged-in-view" class="hidden">
        <span id="user-display" class="user-badge">user@example.com</span>
        <button id="btn-logout" class="btn btn-outline">Log Out</button>
      </div>
    </div>
  </header>

  <!-- fo resze a weboldalnak -->
  <main class="main-wrapper">
    <section class="todo-card">
      <header class="todo-header">
        <h1 class="todo-title">To-Do List</h1>
        <p class="todo-subtitle">Don't wait till' tomorrow!</p>
      </header>

      <!-- task bemenetenek formja -->
      <form id="todo-form" class="todo-form">
        <div class="input-row">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="Type your task here" 
            autocomplete="off" 
            required 
          />
          <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
      </form>

      <!-- task listának a konténere -->
      <div id="todo-status-message" class="status-msg">Loading tasks... Please wait!</div>
      <ul id="todo-list" class="todo-list"></ul>

      <!-- footerben megjeleno informaciok / adatok -->
      <footer id="todo-footer" class="todo-footer hidden">
        <span id="items-left">0 tasks left</span>
        <button id="btn-clear-completed" class="btn-text">Clear Tasks</button>
      </footer>
    </section>
  </main>

  <!-- azonositas (belepes / regisztracios menuk) -->
  <div id="auth-modal" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title">Log In</h2>
        <button id="btn-close-modal" class="modal-close" aria-label="Close modal">&times;</button>
      </div>

      <div class="modal-tabs">
        <button id="tab-login" class="tab-btn active">Log In</button>
        <button id="tab-signup" class="tab-btn">Sign Up</button>
      </div>

      <!-- bejelentkezesi hiba szovege -->
      <div id="auth-error" class="auth-error hidden"></div>

      <form id="auth-form" class="modal-form">
        <div class="form-group">
          <label for="auth-email">Email Address</label>
          <input type="email" id="auth-email" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="At least 8 characters" minlength="8" required />
        </div>

        <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-block">Log In</button>
      </form>

      <div class="modal-divider"><span>or</span></div>

      <button id="btn-guest-login" class="btn btn-outline btn-block">Continue as Guest</button>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
