<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css" />

  <!-- firebase sdk-k -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
</head>
<body>

  <!-- felso navigacios resz / auth -->
  <header class="top-nav">
    <div class="logo">MaybeTomorrow</div>
    <div class="auth-bar">
      <!-- kijelentkezett nézet -->
      <div id="logged-out-view">
        <button id="btn-open-login" class="btn btn-outline">Log In</button>
        <button id="btn-open-signup" class="btn btn-primary">Sign Up</button>
      </div>

      <!-- bejelentkezett nézet -->
      <div id="logged-in-view" class="hidden">
        <span id="user-display" class="user-badge">user@example.com</span>
        <button id="btn-logout" class="btn btn-outline">Log Out</button>
      </div>
    </div>
  </header>

  <!-- fo resze a weboldalnak -->
  <main class="main-wrapper">
    <section class="todo-card">
      <header class="todo-header">
        <h1 class="todo-title">To-Do List</h1>
        <p class="todo-subtitle">Don't wait till' tomorrow!</p>
      </header>

      <!-- task bemenetenek formja -->
      <form id="todo-form" class="todo-form">
        <div class="input-row">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="Type your task here" 
            autocomplete="off" 
            required 
          />
          <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
      </form>
    
  </main>
  <script src="app.js"></script>
</body>
</html>
